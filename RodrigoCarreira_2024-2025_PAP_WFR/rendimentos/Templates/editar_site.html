<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Financeiro</title>
    <link rel="icon" href="{{ url_for('static', filename='assets/img/favicon.ico') }}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div>
    <h2>Editar Site</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Título do Site:</label>
            <input type="text" name="titulo" value="{{ dados.titulo }}" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Selecione a Imagem:</label>
            <select name="imagem" class="form-select">
                {% for img in imagens %}
                    <option value="{{ img }}" {% if img == imagem_atual %}selected{% endif %}>
                        {{ img }}
                    </option>
                {% endfor %}
            </select>
            <small class="text-muted">Imagens devem estar em /static/assets/img/</small>
            
            <div class="mt-2">
                <img src="{{ url_for('static', filename='assets/img/' + imagem_atual) }}" 
                    alt="Pré-visualização" 
                    style="max-height: 100px;"
                    id="imgPreview">
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<script>
    document.querySelector('select[name="imagem"]').addEventListener('change', function() {
        document.getElementById('imgPreview').src = 
            "{{ url_for('static', filename='assets/img/') }}" + this.value;
    });
</script>
</body>
</html>
