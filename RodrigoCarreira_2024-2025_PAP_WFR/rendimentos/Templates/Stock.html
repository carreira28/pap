<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Stock</title>
    <link rel="icon" href="{{ url_for('static', filename='assets/img/favicon.ico') }}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="mt-3 text-center">
      <a href="/adicionar_stock" class="btn-stock"><i class="bi bi-plus-circle"></i> Adicionar Stock</a>
      <a href="/repor_stock" class="btn-stock" aria-label="Iniciar Simulação"><i class="bi bi-plus-circle"></i>Repor Stock</a>
      <a href="/retirar_stock" class="btn-stock" aria-label="Iniciar Simulação"><i class="bi bi-dash-circle"></i> Retirar Stock</a>
      <a href="/" class="btn-start" aria-label="Iniciar Simulação">Voltar</a>
    </div>
    <br>
    <br>
    <h2>Stock Atual dos Produtos</h2>
    <br>
    <div class="sc">
    <table class="table table-bordered table-striped">
      <thead class="thead-light">
        <tr>
          <th>Produto</th>
          <th>Quantidade Atual</th>
        </tr>
      </thead>
      <tbody>
        {% for prod in produtos %}
        <tr>
          <td>{{ prod.nome }}</td>
          <td>{{ prod.quantidade }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
