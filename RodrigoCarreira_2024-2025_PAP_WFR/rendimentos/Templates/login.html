<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="{{ url_for('static', filename='assets/img/favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="alert-container">
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} mt-3">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% endwith %}
    <h2 class="login-title">Login</h2>
    <form method="POST" action="/login" class="login-form">
        <div class="form-group">
            <input type="text" id="username" name="username" placeholder="Utilizador" required class="login-input">
        </div>
        <br>
        <div class="form-group">
            <input type="password" id="password" name="password" placeholder="Password" required class="login-input">
        </div>
        <br>
        <button type="submit" class="login-button">Entrar</button>
    </form>
    <br>
        <div class="form-group">
            <h3>Não tem uma conta? <a href="/nova_conta">Sign up</a></h3>
        </form>
    </form>
</body>
</html>
